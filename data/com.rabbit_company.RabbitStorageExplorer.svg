<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- The shield face reads as a bent surface, so a gradient is permitted. -->
    <linearGradient id="shield" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <!-- Cylinder walls are curved, so they carry the light falloff. -->
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab4ee"/>
      <stop offset="0.4" stop-color="#d6e5fa"/>
      <stop offset="1" stop-color="#8ab4ee"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M 64 14 L 106 30 L 106 66 C 106 90 88 106 64 114 C 40 106 22 90 22 66 L 22 30 Z" fill="url(#shield)"/>

  <!-- Storage layers, drawn bottom to top so each disc seats on the one below -->
  <path d="M 42 79 L 42 88 A 22 7 0 0 0 86 88 L 86 79 Z" fill="url(#wall)"/>
  <ellipse cx="64" cy="79" rx="22" ry="7" fill="#ffffff"/>

  <path d="M 42 62 L 42 71 A 22 7 0 0 0 86 71 L 86 62 Z" fill="url(#wall)"/>
  <ellipse cx="64" cy="62" rx="22" ry="7" fill="#ffffff"/>

  <path d="M 42 45 L 42 54 A 22 7 0 0 0 86 54 L 86 45 Z" fill="url(#wall)"/>
  <ellipse cx="64" cy="45" rx="22" ry="7" fill="#ffffff"/>
</svg>
